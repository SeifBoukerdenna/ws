[project]
name = "market-workbench"
version = "0.1.0"
description = "Personal research workbench for backtesting trading models with full costs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "DTZ", "RUF", "PT", "S", "ERA"]
ignore = [
    # Pseudo-random numbers here drive simulations, never cryptography.
    "S311",
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on bare assert statements.
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
